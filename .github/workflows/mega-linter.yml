# MegaLinter GitHub Action configuration file
# More info at https://megalinter.io
---
name: MegaLinter

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.pull_request.draft != true
    permissions:
      contents: read
      pull-requests: write # for the MegaLinter PR conversation comment reporter

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is required to lint only files changed since the base ref.
          fetch-depth: 0
          persist-credentials: false

      # Linter selection, reporters, and fix behavior live in .mega-linter.yml.
      # PowerShell is linted by the dedicated PowerShell workflow (PSScriptAnalyzer + SARIF).
      - name: MegaLinter
        uses: oxsecurity/megalinter/flavors/documentation@f2fe8c1cba37091848df3e524066c8c23ef353ed # v10.2.0
        id: ml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: >-
            ${{
              github.event_name != 'pull_request'
            }}

      - name: Archive production artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: MegaLinter reports
          retention-days: 7
          path: |
            megalinter-reports
            mega-linter.log
